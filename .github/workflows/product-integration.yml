name: product-integration

# Opt-in: runs the harness against the real GridForge-AI engine. Not part of ordinary CI.
# Needs a token able to read the product repository, supplied as the PRODUCT_REPO_TOKEN secret.
on:
  workflow_dispatch:
    inputs:
      product_ref:
        description: GridForge-AI ref (branch, tag or commit) to test against
        required: true

permissions:
  contents: read

jobs:
  product:
    runs-on: ubuntu-latest
    steps:
      - name: Require the product-repository secret
        env:
          PRODUCT_REPO_TOKEN: ${{ secrets.PRODUCT_REPO_TOKEN }}
        run: |
          if [ -z "$PRODUCT_REPO_TOKEN" ]; then
            echo "::error::PRODUCT_REPO_TOKEN is not set. Add a read-only (contents) token for iceccarelli/GridForge-AI as a repository secret; this workflow cannot run without it."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: iceccarelli/GridForge-AI
          ref: ${{ inputs.product_ref }}
          path: GridForge-AI
          token: ${{ secrets.PRODUCT_REPO_TOKEN }}
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --all-groups
      - run: uv run --locked pytest -m product
        env:
          GRIDFORGE_PRODUCT_DIR: ${{ github.workspace }}/GridForge-AI
