name: product-integration

# Opt-in: runs the harness against the real GridForge-AI engine. Not part of ordinary CI.
# Read-only: it checks out the product at the ref you name and runs `pytest -m product`; it never pushes,
# deploys or changes the product. The product repository is public, so the default workflow token is enough
# and no secret is needed. If it ever becomes private, add a `token:` input to the product checkout (a
# read-only contents token stored as a repository secret); see CONTRIBUTING.md.
on:
  workflow_dispatch:
    inputs:
      product_ref:
        description: GridForge-AI FULL 40-character commit SHA to test against. A branch or tag is refused because it is not a product identity
        required: true

permissions:
  contents: read

jobs:
  product:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse anything but a full commit SHA
        env:
          PRODUCT_REF: ${{ inputs.product_ref }}
        run: |
          if ! printf '%s' "$PRODUCT_REF" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "product_ref must be a full 40-character lowercase commit SHA, got: $PRODUCT_REF" >&2
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: iceccarelli/GridForge-AI
          ref: ${{ inputs.product_ref }}
          path: GridForge-AI
          persist-credentials: false
      - name: Show exactly which commits are under test, and refuse a mismatch
        env:
          PRODUCT_REF: ${{ inputs.product_ref }}
        run: |
          git log -1 --format='harness %H (%s)'
          git -C GridForge-AI log -1 --format='product %H (%s)'
          test "$(git -C GridForge-AI rev-parse HEAD)" = "$PRODUCT_REF"
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --all-groups
      - run: uv run --locked pytest -m product -ra
        env:
          GRIDFORGE_PRODUCT_DIR: ${{ github.workspace }}/GridForge-AI
