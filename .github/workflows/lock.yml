name: lock

# One-off helper: resolve dependencies on a runner with PyPI access and commit uv.lock to the branch it
# runs on. Runs only when this file changes or when dispatched. Delete it once uv.lock is committed.
on:
  push:
    branches: [claude/optimistic-maxwell-izb5q8]
    paths: [.github/workflows/lock.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv lock
      - run: uv lock --check
      - name: Commit lockfile if it changed
        run: |
          if git diff --quiet -- uv.lock && git ls-files --error-unmatch uv.lock >/dev/null 2>&1; then
            echo "uv.lock already up to date"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "Add uv.lock resolved on a PyPI-connected runner"
          git push origin "HEAD:${GITHUB_REF_NAME}"
