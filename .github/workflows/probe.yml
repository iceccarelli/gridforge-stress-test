name: probe

# Read-only verification of the registered publisher pages, run where outbound network exists.
# Uses the harness's guarded fetch layer; no credentials, nothing stored, 3 MB cap, ERCOT stays blocked.
on:
  workflow_dispatch:
  push:
    branches: [claude/optimistic-maxwell-izb5q8]
    paths: [.github/workflows/probe.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --all-groups
      - name: Probe every registered source (fails if any page could not be read)
        shell: bash
        run: |
          set -o pipefail
          uv run --locked gridforge-stress probe --all | tee probe-report.json
      - name: Peek at registered workbooks (explicit; in memory, bounded by the source cap, nothing stored)
        if: always() && github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -o pipefail
          uv run --locked gridforge-stress probe lbnl-queued-up --peek-xlsx | tee probe-workbook.json
      - name: Profile the observed project sheet (bounded value counts; in memory, nothing stored)
        if: always() && github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -o pipefail
          uv run --locked gridforge-stress probe lbnl-queued-up --profile | tee probe-profile.txt
      - name: Queue durations and capacity computed in memory, plus the publisher's own IR-to-COD sheet for cross-checking
        if: always() && github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -o pipefail
          uv run --locked gridforge-stress probe lbnl-queued-up --queue-stats --show-sheet "37. IR to COD - all" | tee probe-queue-stats.txt
      - name: The publisher's codebook and its own sample-by-region sheet (to settle the capacity unit and cross-check regional totals)
        if: always() && github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -o pipefail
          uv run --locked gridforge-stress probe lbnl-queued-up --show-sheet "04. Data Codebook" --show-sheet "02. Data Sample by Region" --show-sheet "07. Active Capacity by Year" | tee probe-codebook.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-report
          path: |
            probe-report.json
            probe-workbook.json
            probe-profile.txt
            probe-queue-stats.txt
            probe-codebook.txt
          if-no-files-found: ignore
