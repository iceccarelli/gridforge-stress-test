name: ci

# Ordinary CI is offline and deterministic: no secrets, no live sources, no product checkout.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --locked --all-groups --python ${{ matrix.python-version }}
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked mypy src
      - run: uv run --locked pytest
      - run: uv run --locked gridforge-stress doctor
      - run: uv run --locked gridforge-stress validate-fixtures

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --all-groups
      - run: uv build
      - name: Wheel must carry registry and schemas
        run: |
          python - <<'PY'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          for need in (
              "_data/configs/sources.json",
              "_data/schemas/source.schema.json",
              "_data/configs/problems.json",
              "_data/schemas/problem.schema.json",
          ):
              assert any(n.endswith(need) for n in names), need
          PY
      - name: twine check (the metadata renders on PyPI)
        # Deliberately not pinned: twine only reads the built files (no credentials), and a pinned release rejects the metadata version the
        # current hatchling writes ('2.5 is not a valid metadata version' with twine 6.1.0).
        run: uvx twine check --strict dist/*
      - name: Install the wheel into a clean environment, away from the checkout, and run it offline
        run: |
          uv venv "$RUNNER_TEMP/venv"
          uv pip install --python "$RUNNER_TEMP/venv/bin/python" dist/*.whl
          cd "$RUNNER_TEMP"
          V="$RUNNER_TEMP/venv/bin"
          "$V/python" -c "import gridforge_stress, pathlib; p = pathlib.Path(gridforge_stress.__file__).resolve(); assert 'site-packages' in p.parts, p; print('installed from', p)"
          "$V/gridforge-stress" sources list
          "$V/gridforge-stress" scenarios list
          "$V/gridforge-stress" validate-fixtures

  dependency-audit:
    # Fails on known vulnerabilities in the locked set; the result is actionable, not cosmetic.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --all-groups
      - name: Audit exactly what uv.lock pins (not the live environment, which contains this project editable)
        run: |
          uv export --locked --all-groups --no-emit-project --no-hashes -o audit-requirements.txt
          uv run --locked pip-audit -r audit-requirements.txt --no-deps --disable-pip --strict
